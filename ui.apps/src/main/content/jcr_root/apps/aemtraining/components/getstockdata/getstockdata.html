<sly data-sly-use.templates="core/wcm/components/commons/v1/templates.html"/>
<sly data-sly-use.stockData="com.adobe.aem.sample.site.core.models.StockDataModel"/>

<sly data-sly-test="${!stockData.listOfCompanyDataResponse.empty}">
    <table>
        <thead>
        <tr>
            <th>Company</th>
            <th>Date</th>
            <th>Opening Price</th>
            <th>Closing Price</th>
        </tr>
        </thead>
        <tbody>
        <sly data-sly-list.item="${stockData.listOfCompanyDataResponse}">
            <tr>
                <td>${item.CompanyName}</td>
                <td>${stockData.date}</td>
                <td>${item.openingPrice}</td>
                <td>${item.closingPrice}</td>
            </tr>
        </sly>
        </tbody>
    </table>
</sly>

<sly data-sly-test="${stockData.listOfCompanyDataResponse.empty}">
    <p>No stock data available.</p>
</sly>

<sly data-sly-call="${templates.placeholder @ isEmpty = true, classAppend='cmp-text'}"></sly>
